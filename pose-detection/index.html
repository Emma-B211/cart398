<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>PoseNet Full Body → OSC</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ml5@0.12.2/dist/ml5.min.js"></script>
</head>

<body>
    <script>
        let video;
        let poseNet;
        let poses = [];
        let socket;

        function setup() {
            createCanvas(640, 480);
            video = createCapture(VIDEO);
            video.size(width, height);
            video.hide();

            // Init PoseNet
            poseNet = ml5.poseNet(video, () => console.log("PoseNet ready"));
            poseNet.on("pose", (results) => (poses = results));

            // Connect to Node.js Bridge
            socket = new WebSocket("ws://localhost:8081");
            socket.onopen = () => console.log("Connected to Bridge ✅");
        }

        function draw() {
            image(video, 0, 0, width, height);

            if (poses.length > 0) {
                let kp = poses[0].pose.keypoints;

                // Draw skeleton keypoints
                for (let i = 0; i < kp.length; i++) {
                    let k = kp[i];
                    if (k.score > 0.3) {
                        fill(0, 255, 0);
                        noStroke();
                        ellipse(k.position.x, k.position.y, 10, 10);
                    }
                }

                // Collect all x,y pairs normalized to 0–1
                let inputs = [];
                for (let i = 0; i < kp.length; i++) {
                    let x = kp[i].position.x / width;
                    let y = kp[i].position.y / height;
                    inputs.push(x, y); // add both values
                }

                // Send OSC through Node
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify(inputs));
                }
            }
        }
    </script>
</body>

</html>
